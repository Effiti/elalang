[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-ela"
description = "A tree-sitter grammar for the Ela language"
version = "0.1.0"
keywords = ["incremental", "parsing", "tree-sitter", "ela"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
authors = [{ name = "Effiti" }]
requires-python = ">=3.10"
license.text = "Apache 2.0"
readme = "README.md"

[project.urls]
Homepage = "https://github.com/effiti/elalang"

[project.optional-dependencies]
core = ["tree-sitter~=0.24"]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
